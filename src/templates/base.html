<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MyTradingView{% endblock %} · Gold SMC Desk</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23fbbf24'/><path d='M56 18 38 52h13l-6 30 24-38H56z' fill='%230d1017'/></svg>">
<link rel="stylesheet" href="/static/css/desk.css?v={{ v }}">
<script src="/static/vendor/lightweight-charts.standalone.production.js" defer></script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- Icon sprite. Replaces the Font Awesome CDN link, which was one of three
     external dependencies that would blank the terminal if the connection
     dropped. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-chart"><path d="M3 3v18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 15l4-5 3 3 5-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-desk"><rect x="3" y="4" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20h18M8 9l3 3 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-analytics"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-strategy"><path d="M12 3v18M3 12h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <g id="i-alarm"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 01-3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-settings"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.7 1.7 0 008.9 19a1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1A1.7 1.7 0 005 8.9a1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-volume"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-mute"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M22 9l-6 6M16 9l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-warn"><path d="M12 3l9.5 17h-19L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5M12 17.5v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-info"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-check"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12.5l2.5 2.5L16 9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-refresh"><path d="M21 12a9 9 0 11-2.6-6.4M21 3v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-bolt"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></g>
    <g id="i-sun"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-bell-on"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 01-3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="18.5" cy="5.5" r="3" fill="currentColor"/></g>
    <g id="i-bell-off"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 01-3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></g>
    <g id="i-empty"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 12h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></g>
  </defs>
</svg>

<header class="hdr">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">R</div>
    <div>
      <div class="brand-name">MyTradingView</div>
      <div class="brand-sub">XAUUSD · SMC Desk</div>
    </div>
  </div>

  <div class="ticker">
    <div class="tick">
      <span class="tick-k">Bid</span>
      <span class="tick-v bid" id="t-bid">—</span>
    </div>
    <div class="tick">
      <span class="tick-k">Ask</span>
      <span class="tick-v ask" id="t-ask">—</span>
    </div>
    <div class="tick">
      <span class="tick-k">Spread</span>
      <span class="tick-v" id="t-spread">—</span>
    </div>
    <div class="tick">
      <span class="tick-k">Balance</span>
      <span class="tick-v" id="t-balance">—</span>
    </div>

    <span class="pill range" id="t-bias" title="Daily directional bias">
      <span class="dot"></span><span id="t-bias-text">Bias: scanning</span>
    </span>

    <span class="pill" id="t-session" title="Session discipline (playbook §4)">
      <span id="t-session-text">Session —</span>
    </span>

    <button class="icon-btn" id="btn-trade-voice" aria-pressed="true"
            title="Mute / unmute BUY and SELL announcements"
            aria-label="Toggle spoken BUY and SELL trade alerts">
      <svg><use href="#i-bell-on"></use></svg>
    </button>

    <button class="icon-btn" id="btn-voice" aria-pressed="true"
            title="All voice alerts on/off" aria-label="Toggle all voice alerts">
      <svg><use href="#i-volume"></use></svg>
    </button>
    <button class="icon-btn" id="btn-theme" title="Light / dark" aria-label="Toggle colour theme">
      <svg><use href="#i-sun"></use></svg>
    </button>

    <span class="pill off" id="t-conn"><span class="dot"></span><span id="t-conn-text">Connecting</span></span>
  </div>
</header>

<nav class="nav" aria-label="Sections">
  {% for id, href, label, desc in pages %}
  <a href="{{ href }}" title="{{ desc }}"
     {% if page == id %}aria-current="page"{% endif %}>
    <svg aria-hidden="true"><use href="#i-{{ id if id in ['chart','desk','analytics','strategy','settings'] else 'alarm' }}"></use></svg>
    <span>{{ label }}</span>
    {% if id == 'alarms' %}<span class="badge" id="alarm-count" hidden>0</span>{% endif %}
  </a>
  {% endfor %}
</nav>

<main id="main" class="{% block mainclass %}{% endblock %}">
{% block content %}{% endblock %}
</main>

<div id="toasts" aria-live="polite" aria-atomic="false"></div>

<script>
  window.DESK = {
    token: {{ token | tojson }},
    page: {{ page | tojson }},
    pollStatus: {{ poll_status }},
    pollChart: {{ poll_chart }},
    persona: {{ cfg.VOICE_PERSONA | tojson }},
    voiceEngine: {{ cfg.VOICE_ENGINE | tojson }},
    browserRate: {{ cfg.VOICE_BROWSER_RATE }},
    browserPitch: {{ cfg.VOICE_BROWSER_PITCH }},
    usdPerPip: {{ cfg.USD_PER_PIP }},
    maxLots: {{ cfg.MAX_LOTS }},
    minLots: 0.01,
    priceDecimals: {{ cfg.PRICE_DECIMALS }}
  };
</script>
<script type="module" src="/static/js/pages/{{ page }}.js?v={{ v }}"></script>
</body>
</html>
